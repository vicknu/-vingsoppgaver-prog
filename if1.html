<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="utskrift"></p>
  <script>
const navn = "Victoria"
let utskrift

if(navn === "Victoria"){
   utskrift = "Mitt navn er " + navn + "Knudsen"
} 

else {
    utskrift = "Jeg heter ikke " + navn + "Knudsen"
}

document.getElementById("utskrift").innerHTML= utskrift 

  </script>  
</body>
</html>
